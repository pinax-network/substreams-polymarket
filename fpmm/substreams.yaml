specVersion: v0.1.0
package:
  name: fpmm
  version: v0.1.0
  url: https://github.com/pinax-network/substreams-polymarket
  description: FixedProductMarketMaker events substreams package
  image: ../image.png

protobuf:
  files:
    - fpmm.proto
  importPaths:
    - ../proto/v1

binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/fpmm.wasm

modules:
  - name: map_events
    kind: map
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:fpmm.v1.Events

network: polygon

params:
  # FixedProductMarketMaker
  map_events: ""
