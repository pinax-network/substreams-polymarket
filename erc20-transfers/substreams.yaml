specVersion: v0.1.0
package:
  name: erc20_transfers
  version: v0.1.0
  url: https://github.com/pinax-network/substreams-polymarket
  description: ERC-20 & WETH Events substreams package
  image: ../image.png

protobuf:
  files:
    - erc20-transfers.proto
  importPaths:
    - ../proto/v1

binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/erc20_transfers.wasm

modules:
  - name: map_events
    kind: map
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:erc20.transfers.v1.Events

network: polygon

params:
  # USDC (collateral)
  map_events: "evt_addr:0x2791bca1f2de4661ed88a30c99a7a9449aa84174"
