specVersion: v0.1.0
package:
  name: conditional_tokens
  version: v0.1.0
  url: https://github.com/pinax-network/substreams-polymarket
  description: Polymarket - Conditional Tokens events on Polygon
  image: ../image.png

protobuf:
  files:
    - conditional-tokens.proto
  importPaths:
    - ../proto/v1

binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/conditional_tokens.wasm

modules:
  - name: map_events
    kind: map
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:conditional_tokens.v1.Events

network: polygon

params:
  # Conditional Tokens
  map_events: "evt_addr:0x4d97dcd97ec945f40cf65f87097ace5ea0476045"
