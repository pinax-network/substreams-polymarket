specVersion: v0.1.0
package:
  name: polymarket
  version: v0.3.0
  url: https://github.com/pinax-network/substreams-polymarket
  description: Polymarket events on Polygon
  image: ./image.png

protobuf:
  files:
    - polymarket.proto
  importPaths:
    - ./proto
  excludePaths:
    - sf/substreams
    - google

binaries:
  default:
    type: wasm/rust-v1
    file: ./target/wasm32-unknown-unknown/release/polymarket.wasm

modules:
  - name: map_events
    kind: map
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:polymarket.v1.Events

network: polygon

params:
  map_events: "evt_addr:0x4bfb41d5b3570defd03c39a9a4d8de6bd8b8982e || evt_addr:0xc5d563a36ae78145c45a50134d48a1215220f80a || evt_addr:0xe111180000d2663c0091e4f400237545b87b996b || evt_addr:0xe2222d279d744050d28e00520010520000310f59 || evt_addr:0xc011a7e12a19f7b1f670d46f03b03f3342e82dfb || evt_addr:0x6bbcef9f7ef3b6c592c99e0f206a0de94ad0925f || evt_addr:0x93070a847efef7f70739046a929d47a521f5b8ee || evt_addr:0x2957922eb93258b93368531d39facca3b4dc5854 || evt_addr:0xebc2459ec962869ca4c0bd1e06368272732bcb08 || evt_addr:0xada100874d00e3331d00f2007a9c336a65009718 || evt_addr:0xada200001000ef00d07553cee7006808f895c6f1 || evt_addr:0x4d97dcd97ec945f40cf65f87097ace5ea0476045 || evt_addr:0xd91e80cf2e7be2e162c6513ced06f1dd0da35296 || evt_addr:0xf16a3bdffb7b882e3236243e901f6c5953e2ee0d || evt_addr:0xaacfeea03eb1561c4e67d661e40682bd20e3541b || evt_addr:0xab45c5a4b0c941a2f231c04c3f49182e1a254052 || evt_addr:0x2f5e3684cb1f318ec51b00edba38d79ac2c0aa9d || evt_addr:0x6a9d222616c90fca5754cd1333cfd9b7fb6a4f74 || evt_addr:0xcb1822859cef82cd2eb4e6276c7916e692995130 || evt_addr:0xe3f18acc55091e2c48d883fc8c8413319d4ab7b0 || evt_addr:0x56c79347e95530c01a2fc76e732f9566da16e113 || evt_addr:0xb768891e3130f6df18214ac804d4db76c2c37730 || evt_addr:0x78769d50be1763ed1ca0d5e878d93f05aabff29e"
