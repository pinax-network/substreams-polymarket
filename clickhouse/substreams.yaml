specVersion: v0.1.0
package:
  name: clickhouse
  version: v0.2.6
  url: https://github.com/pinax-network/substreams-polymarket
  description: DEX swaps for JustSwap, SunSwap, and SunPump on EVM blockchain
  image: ../image.png

imports:
  # SQL Sink Substreams
  database_changes: ./packages/substreams-database-change-v2.0.0.spkg
  sql: ./packages/substreams-sink-sql-protodefs-v1.0.7.spkg

  # Events
  erc1155: ../erc1155/substreams.yaml
  polymarket: ../polymarket/substreams.yaml
  umactfadapter: ../umactfadapter/substreams.yaml

binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/clickhouse.wasm
modules:
  - name: db_out
    kind: map
    inputs:
      - source: sf.substreams.v1.Clock
      - map: polymarket:map_events
      - map: erc1155:map_events
      - map: umactfadapter:map_events
    output:
      type: proto:sf.substreams.sink.database.v1.DatabaseChanges

sink:
  module: db_out
  type: sf.substreams.sink.sql.v1.Service
  config:
    schema: "./schema.sql"
    engine: clickhouse
    postgraphile_frontend:
      enabled: false

network: polygon