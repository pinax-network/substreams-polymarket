specVersion: v0.1.0
package:
  name: safe_proxy_factory
  version: v0.4.0
  url: https://github.com/pinax-network/substreams-polymarket
  description: SafeProxyFactory events substreams package
  image: ../image.png

protobuf:
  files:
    - safe-proxy-factory.proto
  importPaths:
    - ../proto/v1

binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/safe_proxy_factory.wasm

modules:
  - name: map_events
    kind: map
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:safe_proxy_factory.v1.Events

network: polygon
