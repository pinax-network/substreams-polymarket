specVersion: v0.1.0
package:
  name: safe_proxy_factory
  version: v0.1.0
  url: https://github.com/pinax-network/substreams-polymarket
  description: Polymarket - Safe Proxy Factory events on Polygon
  image: ../image.png

protobuf:
  files:
    - safe-proxy-factory.proto
  importPaths:
    - ../proto/v1

binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/safe_proxy_factory.wasm

modules:
  - name: map_events
    kind: map
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:safe_proxy_factory.v1.Events

network: polygon

params:
  # Gnosis Safe Factory + Polymarket Proxy Factory
  map_events: "evt_addr:0xaacfeea03eb1561c4e67d661e40682bd20e3541b || evt_addr:0xab45c5a4b0c941a2f231c04c3f49182e1a254052"
