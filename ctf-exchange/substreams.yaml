specVersion: v0.1.0
package:
  name: ctf_exchange
  version: v0.2.0
  url: https://github.com/pinax-network/substreams-polymarket
  description: Polymarket - CTF Exchange events on Polygon
  image: ../image.png

binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/ctf_exchange.wasm

protobuf:
  files:
    - ctf-exchange.proto
  importPaths:
    - ../proto/v1/
  excludePaths:
    - sf/substreams
    - google

modules:
  - name: map_events
    kind: map
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:ctf_exchange.v1.Events

  - name: store_token
    kind: store
    updatePolicy: set
    valueType: proto:ctf_exchange.v1.StoreToken
    inputs:
      - map: map_events

network: polygon

params:
  # V1 CTFExchange + V1 NegRiskCTFExchange + V2 trading + V2 collateral/ramp/adapter contracts
  map_events: "evt_addr:0x4bfb41d5b3570defd03c39a9a4d8de6bd8b8982e || evt_addr:0xc5d563a36ae78145c45a50134d48a1215220f80a || evt_addr:0xe111180000d2663c0091e4f400237545b87b996b || evt_addr:0xe2222d279d744050d28e00520010520000310f59 || evt_addr:0xc011a7e12a19f7b1f670d46f03b03f3342e82dfb || evt_addr:0x6bbcef9f7ef3b6c592c99e0f206a0de94ad0925f || evt_addr:0x93070a847efef7f70739046a929d47a521f5b8ee || evt_addr:0x2957922eb93258b93368531d39facca3b4dc5854 || evt_addr:0xebc2459ec962869ca4c0bd1e06368272732bcb08 || evt_addr:0xada100874d00e3331d00f2007a9c336a65009718 || evt_addr:0xada200001000ef00d07553cee7006808f895c6f1"
