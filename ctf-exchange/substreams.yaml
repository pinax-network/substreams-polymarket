specVersion: v0.1.0
package:
  name: ctf_exchange
  version: v0.1.0
  url: https://github.com/pinax-network/substreams-polymarket
  description: Polymarket: CTF Exchange events on Polygon
  image: ../image.png

binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/ctf_exchange.wasm

protobuf:
  files:
    - ctf-exchange.proto
  importPaths:
    - ../proto/v1/
  excludePaths:
    - sf/substreams
    - google

modules:
  - name: map_events
    kind: map
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:ctf_exchange.v1.Events

  - name: store_token
    kind: store
    updatePolicy: set
    valueType: proto:ctf_exchange.v1.StoreToken
    inputs:
      - map: map_events

network: polygon

params:
  # CTF Exchange (CTFExchange) + Neg Risk CTF Exchange (NegRiskCTFExchange)
  map_events: "evt_addr:0x4bfb41d5b3570defd03c39a9a4d8de6bd8b8982e || evt_addr:0xc5d563a36ae78145c45a50134d48a1215220f80a"
