specVersion: v0.1.0
package:
  name: polymarket
  version: v0.2.0
  url: https://github.com/pinax-network/substreams-polymarket
  description: Polymarket - Database changes for Polygon market data
  image: ../image.png

imports:
  database_changes: ../spkg/substreams-database-change-v2.0.0.spkg

  # Events
  ctf_exchange: ../spkg/ctf-exchange-v0.2.0.spkg
  uma_ctf_adapter: ../spkg/uma-ctf-adapter-v0.1.0.spkg
  negrisk_adapter: ../spkg/negrisk-adapter-v0.1.0.spkg
  conditional_tokens: ../spkg/conditional-tokens-v0.1.0.spkg
  safe_proxy_factory: ../spkg/safe-proxy-factory-v0.1.0.spkg
  fee_module: ../spkg/fee-module-v0.1.0.spkg

binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/polymarket.wasm

modules:
  - name: db_out
    kind: map
    inputs:
      - source: sf.substreams.v1.Clock
      - map: ctf_exchange:map_events
      - map: uma_ctf_adapter:map_events
      - map: negrisk_adapter:map_events
      - map: conditional_tokens:map_events
      - map: safe_proxy_factory:map_events
      - map: fee_module:map_events
    output:
      type: proto:sf.substreams.sink.database.v1.DatabaseChanges

network: polygon
