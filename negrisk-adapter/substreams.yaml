specVersion: v0.1.0
package:
  name: negrisk_adapter
  version: v0.1.0
  url: https://github.com/pinax-network/substreams-polymarket
  description: Polymarket - Neg Risk Adapter events on Polygon
  image: ../image.png

protobuf:
  files:
    - negrisk-adapter.proto
  importPaths:
    - ../proto/v1

binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/negrisk_adapter.wasm

modules:
  - name: map_events
    kind: map
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:negrisk_adapter.v1.Events

network: polygon

params:
  # Neg Risk Adapter (current) + Neg Risk Adapter (legacy)
  map_events: "evt_addr:0xd91e80cf2e7be2e162c6513ced06f1dd0da35296 || evt_addr:0xf16a3bdffb7b882e3236243e901f6c5953e2ee0d"
