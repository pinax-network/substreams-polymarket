specVersion: v0.1.0
package:
  name: uma_ctf_adapter
  version: v0.1.0
  url: https://github.com/pinax-network/substreams-polymarket
  description: Polymarket: UMA CTF Adapter events on Polygon
  image: ../image.png

protobuf:
  files:
    - uma-ctf-adapter.proto
  importPaths:
    - ../proto/v1

binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/uma_ctf_adapter.wasm

modules:
  - name: map_events
    kind: map
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:uma_ctf_adapter.v1.Events

network: polygon

params:
  # UmaCtfAdapter v3.0 + UmaCtfAdapter v2.0
  map_events: "evt_addr:0x2f5e3684cb1f318ec51b00edba38d79ac2c0aa9d || evt_addr:0x6a9d222616c90fca5754cd1333cfd9b7fb6a4f74"
