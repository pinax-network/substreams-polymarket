syntax = "proto3";

package common.v1;

// Common/shared shapes and metadata for Transactions and Logs.
// This file imports the combined Event union so Log can include a strongly-typed event.
// Note: adjust the path if you store files in a different layout.

// import "google/protobuf/timestamp.proto";

// Transaction-level metadata (shared fields)
message TransactionMeta {
  bytes hash = 1;
  bytes from = 2;
  optional bytes to = 3;    // optional presence if needed
  uint64 nonce = 4;
  string gas_price = 5;     // uint256 encoded as string
  uint64 gas_limit = 6;
  uint64 gas_used = 7;
  string value = 8;         // uint256 encoded as string
  // add e.g. tx_index, status, fee, etc. as needed
}

// Log-level metadata (shared fields)
message LogMeta {
  bytes address = 1;
  uint64 ordinal = 2;       // position in tx or block
  repeated bytes topics = 3;
  bytes data = 4;
  // add e.g. log_index, removed(bool) etc. if required
}
