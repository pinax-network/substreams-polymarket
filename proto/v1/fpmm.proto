syntax = "proto3";

package fpmm.v1;

message Events { repeated Transaction transactions = 1; }

message Transaction {
  bytes hash = 1;
  bytes from = 2;
  optional bytes to = 3;
  uint64 nonce = 5;
  string gas_price = 6; // uint256
  uint64 gas_limit = 7;
  uint64 gas_used = 8;
  string value = 9; // uint256
  repeated Log logs = 10;
}

// FixedProductMarketMaker events
message Log {
  bytes address = 1;
  uint64 ordinal = 2;
  repeated bytes topics = 3;
  bytes data = 4;
  oneof log {
    // FPMM events
    FPMMFundingAdded fpmm_funding_added = 10;
    FPMMFundingRemoved fpmm_funding_removed = 11;
    FPMMBuy fpmm_buy = 12;
    FPMMSell fpmm_sell = 13;
    // Factory events
    ProxyCreation proxy_creation = 14;
    ProxyCreationL2 proxy_creation_l2 = 15;
    ChainSpecificProxyCreationL2 chain_specific_proxy_creation_l2 = 16;
  }
}

// FPMMFundingAdded event
message FPMMFundingAdded {
  bytes funder = 1; // address (indexed)
  repeated string amounts_added = 2; // uint256[]
  string shares_minted = 3; // uint256
}

// FPMMFundingRemoved event
message FPMMFundingRemoved {
  bytes funder = 1; // address (indexed)
  repeated string amounts_removed = 2; // uint256[]
  string collateral_removed_from_fee_pool = 3; // uint256
  string shares_burnt = 4; // uint256
}

// FPMMBuy event
message FPMMBuy {
  bytes buyer = 1; // address (indexed)
  string investment_amount = 2; // uint256
  string fee_amount = 3; // uint256
  string outcome_index = 4; // uint256 (indexed)
  string outcome_tokens_bought = 5; // uint256
}

// FPMMSell event
message FPMMSell {
  bytes seller = 1; // address (indexed)
  string return_amount = 2; // uint256
  string fee_amount = 3; // uint256
  string outcome_index = 4; // uint256 (indexed)
  string outcome_tokens_sold = 5; // uint256
}

// Factory events (from SafeProxyFactory)
// https://github.com/safe-global/safe-contracts/blob/main/contracts/proxies/SafeProxyFactory.sol

message ProxyCreation {
  bytes proxy = 10; // address
  bytes singleton = 11; // address
}

message ProxyCreationL2 {
  bytes proxy = 10; // address
  bytes singleton = 11; // address
  bytes initializer = 12; // bytes
  string salt_nonce = 13; // uint256
}

message ChainSpecificProxyCreationL2 {
  bytes proxy = 10; // address
  bytes singleton = 11; // address
  bytes initializer = 12; // bytes
  string salt_nonce = 13; // uint256
  string chain_id = 14; // uint256
}
