specVersion: v0.1.0
package:
  name: fee_module
  version: v0.1.0
  url: https://github.com/pinax-network/substreams-polymarket
  description: FeeModule events substreams package
  image: ../image.png

protobuf:
  files:
    - fee-module.proto
  importPaths:
    - ../proto/v1

binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/fee_module.wasm

modules:
  - name: map_events
    kind: map
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:fee_module.v1.Events

network: polygon
