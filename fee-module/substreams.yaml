specVersion: v0.1.0
package:
  name: fee_module
  version: v0.1.0
  url: https://github.com/pinax-network/substreams-polymarket
  description: Polymarket - Fee Module events on Polygon
  image: ../image.png

protobuf:
  files:
    - fee-module.proto
  importPaths:
    - ../proto/v1

binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/fee_module.wasm

modules:
  - name: map_events
    kind: map
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:fee_module.v1.Events

network: polygon

params:
  # FeeModule (v2 + v0.0.1) + NegRiskFeeModule (v2 + v1)
  map_events: "evt_addr:0xe3f18acc55091e2c48d883fc8c8413319d4ab7b0 || evt_addr:0x56c79347e95530c01a2fc76e732f9566da16e113 || evt_addr:0xb768891e3130f6df18214ac804d4db76c2c37730 || evt_addr:0x78769d50be1763ed1ca0d5e878d93f05aabff29e"
