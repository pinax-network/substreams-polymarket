[workspace]
members = ["clickhouse", "polymarket", "erc1155", "common", "proto", "umactfadapter"]
resolver = "2"

[workspace.package]
description = "Polymarket Substreams"
edition = "2021"
version = "0.0.0"
license = "Apache-2.0"

[workspace.dependencies]
substreams = "0.7.0"
substreams-abis = { git = "https://github.com/pinax-network/substreams-abis.git", rev = "3412d729406ff427e9cd9fc58d70ede7de85b26f" }
substreams-ethereum = "0.11.1"
substreams-database-change = "3.0.0"
prost = "0.13"
prost-types = "0.13"

[profile.release]
lto = true
