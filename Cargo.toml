[workspace]
members = [
    "clickhouse",
    "ctf-exchange",
    "common",
    "proto",
    "uma-ctf-adapter",
    "negrisk-adapter",
    "conditional-tokens",
    "safe-proxy-factory",
    "fee-module",
    "fpmm-factory",
]
resolver = "2"

[workspace.package]
description = "Polymarket Substreams"
edition = "2021"
version = "0.0.0"
license = "Apache-2.0"

[workspace.dependencies]
substreams = "0.7.0"
substreams-abis = { git = "https://github.com/pinax-network/substreams-abis.git", rev = "5247988b9bf8bcc286141451216b96d53a51ac3c" }
substreams-ethereum = "0.11.1"
substreams-database-change = "3.0.0"
prost = "0.13"
prost-types = "0.13"

[profile.release]
lto = true
