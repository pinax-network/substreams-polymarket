[workspace]
members = ["clickhouse", "polymarket", "erc1155", "erc20transfers", "common", "proto", "umactfadapter", "negriskadapter", "conditionaltokens", "safeproxyfactory", "feemodule"]
resolver = "2"

[workspace.package]
description = "Polymarket Substreams"
edition = "2021"
version = "0.0.0"
license = "Apache-2.0"

[workspace.dependencies]
substreams = "0.7.0"
substreams-abis = { git = "https://github.com/pinax-network/substreams-abis.git", rev = "99c80732f2fb943ee813b101ec1a8ca8b13585bc" }
substreams-ethereum = "0.11.1"
substreams-database-change = "3.0.0"
prost = "0.13"
prost-types = "0.13"

[profile.release]
lto = true
